
name: Build Amha Player Pro APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p AmhaPlayerPro assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
       - name: Extract project
         run: unzip -q AmhaPlayerPro.zip
        with:
          name: AmhaPlayerPro-debug
          path: AmhaPlayerPro/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
